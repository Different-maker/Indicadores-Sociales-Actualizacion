<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualización de Indicadores Sociales (ENAHO)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Public Sans',Arial,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
button,select,input{font:inherit}
input::placeholder{color:#64748b}
input:focus,select:focus{outline:2px solid #0d9488;outline-offset:1px}
button:focus-visible{outline:2px solid #0d9488;outline-offset:2px}
.topbar{background:linear-gradient(90deg,#172554,#0f766e);color:#fff;padding:0 32px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;padding:8px 0}
.api{display:flex;align-items:center;gap:8px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
main{max-width:1200px;width:100%;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:20px}
.crumbs{font-size:12px;font-weight:500;color:#475569;margin-bottom:6px;letter-spacing:.2px}
.crumbs b{color:#1e40af;font-weight:600}
h1{margin:0;font-size:26px;font-weight:700}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.08),0 10px 28px rgba(15,23,42,.06)}
nav{display:flex;flex-wrap:nowrap;gap:12px;padding:16px 24px;border-bottom:1px solid #e2e8f0;background:#f8fafc;width:100%;overflow-x:auto}
.tab{display:flex;align-items:center;justify-content:center;flex:1 1 0;min-height:48px;padding:12px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;color:#475569;background:#fff;border:1px solid #cbd5e1;white-space:nowrap}
.tab.active{font-weight:600;color:#fff;background:linear-gradient(90deg,#1e40af,#0f766e);border-color:transparent;box-shadow:0 4px 12px rgba(15,118,110,.3)}
.body{display:flex;flex-wrap:wrap;gap:32px;padding:32px}
.form{flex:1 1 440px;display:flex;flex-direction:column;gap:20px}
.sec-head{padding-bottom:16px;border-bottom:1px solid #e2e8f0}
.sec-title{font-size:17px;font-weight:700;color:#172554}
.sec-desc{font-size:13px;color:#475569;margin-top:4px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:#334155}
.field select,.field input{font-size:14px;height:44px;padding:0 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a;width:100%}
.field select{cursor:pointer}
.field select:disabled{background:#f1f5f9;color:#64748b;cursor:not-allowed}
.field input[readonly]{background:#f1f5f9;color:#172554;font-weight:600;letter-spacing:1px}
aside{flex:1 1 320px;background:#f0fdfa;border:1px solid #ccfbf1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;min-height:300px}
.logo{background:#fff;border:1px solid #ccfbf1;border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center}
.logo img{width:240px;max-width:100%;height:auto;display:block}
.box{background:#fff;border:1px solid #ccfbf1;border-radius:8px;text-align:center}
.pt{font-size:15px;font-weight:700;color:#172554;text-align:center}
.src{font-size:13px;color:#475569;margin-top:4px;text-align:center}
.reg{padding:10px 16px;width:100%;max-width:280px}
.reg .l,.stat .l{font-size:12px;color:#475569}
.reg .v{font-size:14px;font-weight:600;color:#172554;margin-top:2px;line-height:1.4}
.stat{padding:12px 20px;min-width:180px}
.stat .v{font-size:26px;font-weight:700;color:#172554}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:20px 32px;border-top:1px solid #e2e8f0;background:#f8fafc}
.msg{font-size:13px;font-weight:500;padding:10px 14px;border-radius:8px;display:none}
.msg.ok{display:block;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.msg.info{display:block;background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.sp{flex:1 1 0}
.btn{font-size:14px;font-weight:600;border-radius:8px;padding:0 24px;height:44px;cursor:pointer;display:flex;align-items:center;gap:8px}
.btn.sec{color:#334155;background:#fff;border:1px solid #cbd5e1}
.btn.pri{color:#fff;background:linear-gradient(90deg,#1e40af,#0f766e);border:0}
@media (max-width:600px){main{padding:16px}.body{padding:20px}.foot{padding:16px 20px}.topbar{padding:0 16px}}
</style>
</head>

const DEPTOS = ['Amazonas','Ancash','Apurimac','Arequipa','Ayacucho','Cajamarca','Callao','Cusco','Huancavelica','Huanuco','Ica','Junin','La Libertad','Lambayeque','Lima','Loreto','Madre De Dios','Moquegua','Pasco','Piura','Puno','San Martin','Tacna','Tumbes','Ucayali'];
const cat = CAT.split(';').map(function (r) { const a = r.split('|'); return { u: a[0], p: a[1], d: a[2] }; });
const $ = function (id) { return document.getElementById(id); };
const esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
const blank = function () { return { anio: '', depto: '', prov: '', ubigeo: '', totEst: '', estVirt: '', trabRem: '', totTrab: '' }; };
const state = { tab: 'ubigeo', v: blank() };

const TABS = [['ubigeo', 'Datos UBIGEO'], ['educacion', 'Módulo Educación'], ['empleo', 'Módulo Empleo']];
const SECS = {
  ubigeo: ['Ubicación y año', 'Elige el año de la encuesta y el distrito. El código UBIGEO se genera automáticamente.'],
  educacion: ['Educación virtual', 'Ingresa el total de estudiantes y cuántos acceden de forma virtual. El porcentaje se calcula automáticamente.'],
  empleo: ['Teletrabajo', 'Ingresa el total de trabajadores y cuántos trabajan de forma remota. El porcentaje se calcula automáticamente.']
};
const NUM = {
  educacion: [['totEst', 'Total de Estudiantes', 'Cantidad total'], ['estVirt', 'Estudiantes Virtuales', 'Estudiantes con acceso virtual']],
  empleo: [['trabRem', 'Trabajadores Remotos', 'Trabajadores en teletrabajo'], ['totTrab', 'Total Trabajadores', 'Cantidad total']]
};

function showMsg(kind, text) { const m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; }
function clearMsg() { const m = $('msg'); m.className = 'msg'; m.textContent = ''; }

function renderTabs() {
  $('tabs').innerHTML = TABS.map(function (t) {
    return '<button type="button" class="tab' + (state.tab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { state.tab = b.dataset.tab; clearMsg(); renderTabs(); renderForm(); updatePanel(); });
  });
}

function opts(list, sel, ph) {
  return '<option value="">' + ph + '</option>' + list.map(function (o) {
    return '<option value="' + esc(o.value) + '"' + (o.value === sel ? ' selected' : '') + '>' + esc(o.label) + '</option>';
  }).join('');
}
function field(id, label, control) { return '<div class="field"><label for="' + id + '">' + label + '</label>' + control + '</div>'; }

function renderForm(focusId) {
  const v = state.v, t = state.tab;
  let h = '<div class="sec-head"><div class="sec-title">' + SECS[t][0] + '</div><div class="sec-desc">' + SECS[t][1] + '</div></div>';
  if (t === 'ubigeo') {
    const anios = [2025, 2024, 2023, 2022, 2021, 2020, 2019].map(function (y) { return { value: String(y), label: String(y) }; });
    const deptos = DEPTOS.map(function (n, i) { return { value: ('0' + (i + 1)).slice(-2), label: n }; });
    const inDep = cat.filter(function (c) { return c.u.slice(0, 2) === v.depto; });
    const provs = Array.from(new Set(inDep.map(function (c) { return c.p; }))).sort().map(function (p) { return { value: p, label: p }; });
    const dists = inDep.filter(function (c) { return c.p === v.prov; }).map(function (c) { return { value: c.u, label: c.d }; });
    h += field('f-anio', 'Año de Encuesta', '<select id="f-anio">' + opts(anios, v.anio, 'Selecciona el año') + '</select>');
    h += field('f-depto', 'Departamento', '<select id="f-depto">' + opts(deptos, v.depto, 'Selecciona el departamento') + '</select>');
    h += field('f-prov', 'Provincia', '<select id="f-prov"' + (v.depto ? '' : ' disabled') + '>' + opts(provs, v.prov, 'Selecciona la provincia') + '</select>');
    h += field('f-dist', 'Distrito', '<select id="f-dist"' + (v.prov ? '' : ' disabled') + '>' + opts(dists, v.ubigeo, 'Selecciona el distrito') + '</select>');
    h += field('f-ubigeo', 'Código UBIGEO', '<input id="f-ubigeo" type="text" readonly value="' + esc(v.ubigeo) + '" placeholder="Se genera automáticamente">');
  } else {
    NUM[t].forEach(function (d) {
      h += field('f-' + d[0], d[1], '<input id="f-' + d[0] + '" type="text" inputmode="numeric" value="' + esc(v[d[0]]) + '" placeholder="' + d[2] + '">');
    });
  }
  $('form').innerHTML = h;

  const pick = function (id, patch) {
    const el = $(id);
    if (!el) return;
    el.addEventListener('change', function () {
      Object.assign(state.v, patch(el.value));
      clearMsg(); renderForm(id); updatePanel();
    });
  };
  pick('f-anio', function (x) { return { anio: x }; });
  pick('f-depto', function (x) { return { depto: x, prov: '', ubigeo: '' }; });
  pick('f-prov', function (x) { return { prov: x, ubigeo: '' }; });
  pick('f-dist', function (x) { return { ubigeo: x }; });
  if (t !== 'ubigeo') {
    NUM[t].forEach(function (d) {
      const el = $('f-' + d[0]);
      el.addEventListener('input', function () {
        el.value = el.value.replace(/\D/g, '').slice(0, 12);
        state.v[d[0]] = el.value;
        clearMsg(); updatePanel();
      });
    });
  }
  if (focusId && $(focusId)) $(focusId).focus();
}

function pct(a, b) { return (+b > 0 && a !== '') ? (Math.round((+a / +b) * 1000) / 10) + '%' : '—'; }

function updatePanel() {
  const v = state.v, t = state.tab;
  let title = 'Ubicación geográfica', label = 'Código UBIGEO', value = v.ubigeo || '—';
  if (t === 'educacion') { title = 'Acceso a educación virtual'; label = '% de estudiantes virtuales'; value = pct(v.estVirt, v.totEst); }
  if (t === 'empleo') { title = 'Teletrabajo'; label = '% de trabajadores remotos'; value = pct(v.trabRem, v.totTrab); }
  const row = cat.find(function (c) { return c.u === v.ubigeo; });
  const place = v.depto ? [DEPTOS[+v.depto - 1], v.prov, row ? row.d : ''].filter(Boolean).join(' › ') : '';
  $('panelTitle').textContent = title;
  $('statLabel').textContent = label;
  $('statValue').textContent = value;
  $('registro').textContent = (v.anio || place) ? [v.anio, place].filter(Boolean).join(' · ') : 'Aún sin seleccionar';
}

function goTab(t) { state.tab = t; renderTabs(); renderForm(); updatePanel(); }

$('btnSave').addEventListener('click', function () {
  const x = state.v, miss = [];
  if (!x.anio) miss.push('Año de Encuesta');
  if (!x.ubigeo) miss.push('Departamento, Provincia y Distrito');
  if (miss.length) { goTab('ubigeo'); return showMsg('err', 'Falta completar en Datos UBIGEO: ' + miss.join(', ') + '.'); }
  const eduAny = x.totEst !== '' || x.estVirt !== '', eduFull = x.totEst !== '' && x.estVirt !== '';
  const empAny = x.trabRem !== '' || x.totTrab !== '', empFull = x.trabRem !== '' && x.totTrab !== '';
  if (eduAny && !eduFull) { goTab('educacion'); return showMsg('err', 'Completa los dos campos del Módulo Educación o déjalos vacíos.'); }
  if (empAny && !empFull) { goTab('empleo'); return showMsg('err', 'Completa los dos campos del Módulo Empleo o déjalos vacíos.'); }
  if (!eduFull && !empFull) return showMsg('err', 'Registra al menos un módulo: Educación o Empleo.');
  if (eduFull && +x.estVirt > +x.totEst) { goTab('educacion'); return showMsg('err', 'Los estudiantes virtuales no pueden superar el total de estudiantes.'); }
  if (empFull && +x.trabRem > +x.totTrab) { goTab('empleo'); return showMsg('err', 'Los trabajadores remotos no pueden superar el total de trabajadores.'); }
  const mods = [eduFull ? 'Educación' : '', empFull ? 'Empleo' : ''].filter(Boolean).join(' y ');
  showMsg('ok', 'Indicadores ' + x.anio + ' guardados: Módulo ' + mods + '.');
});

$('btnClear').addEventListener('click', function () {
  state.v = blank(); goTab('ubigeo'); showMsg('info', 'Campos limpiados.');
});

renderTabs(); renderForm(); updatePanel();
</script>
